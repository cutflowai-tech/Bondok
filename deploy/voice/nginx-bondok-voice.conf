# /etc/nginx/sites-available/<voice host>: TLS for the ElevenLabs custom-LLM endpoint only. Everything else is 404.
# Certificate: certbot --nginx -d <voice host> (after the DNS A record points at this host).
server {
    listen 80;
    listen [::]:80;
    server_name <voice host>;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <voice host>;
    ssl_certificate /etc/letsencrypt/live/<voice host>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<voice host>/privkey.pem;
    access_log off;                       # no request log (bodies are never logged by nginx anyway)
    client_max_body_size 256k;
    location = /v1/chat/completions {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_buffering off;              # stream tokens as they come (SSE)
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_set_header Connection "";
    }
    location / { return 404; }
}
