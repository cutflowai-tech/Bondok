; Bondok voice route (deploy/voice/pbx_route.sh). Extension 111 -> Bondok's bridge (AudioSocket 127.0.0.1:9020).
; Identity: the authenticated PJSIP endpoint (digest auth by username; caller ID is not used), digits only, in the
; last 12 digits of the AudioSocket UUID. No endpoint -> busy tone. No recording.
[bondok-voice]
exten => 111,1,Goto(bondok-voice-agent,s,1)

[bondok-voice-agent]
exten => s,1,NoOp(Bondok voice call)
 same => n,Set(BK_EP=${FILTER(0123456789,${CHANNEL(endpoint)})})
 same => n,GotoIf($["${BK_EP}" = ""]?unavailable)
 same => n(connect),Answer()
 same => n,Set(BK_START=${EPOCH})
 same => n,Set(BK_EP12=000000000000${BK_EP})
 same => n,AudioSocket(${UUID():0:24}${BK_EP12:-12},127.0.0.1:9020)
 same => n,GotoIf($[${EPOCH} - ${BK_START} < 3]?unavailable)
 same => n,Hangup()
 same => n(unavailable),NoOp(Bondok voice unavailable)
 same => n,Congestion(4)

; Fixture line for automated tests: reachable only by an originate on this host (not included in any phone
; context). It presents the synthetic line 99019 (role "test": isolated acceptance items only). Only this fixture
; is recorded (synthetic voices), for the automated check, which deletes the file afterwards.
[bondok-voice-fixture]
exten => s,1,NoOp(Bondok voice fixture call)
 same => n,Set(BK_EP=99019)
 same => n,MixMonitor(bondok-fixture-${UNIQUEID}.wav,r(bondok-fixture-${UNIQUEID}-caller.wav)t(bondok-fixture-${UNIQUEID}-bondok.wav))
 same => n,Goto(bondok-voice-agent,s,connect)
